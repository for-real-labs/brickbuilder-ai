[project]
name = "brickai-backend-api"
version = "0.1.0"
description = "Convert a 3D object into a brick structure."
readme = "README.md"
# The backend as a whole, as run: it includes AGPL-3.0 code (fable_agent/toolkit) and uses a GPL-3.0-or-later
# library. Files written for BrickBuilder are also offered under MIT. See the License section of the root README.
license = "AGPL-3.0-only AND MIT AND CC-BY-SA-4.0"
authors = [
    { name = "Jake Johnson", email = "jake@frlabs.dev" }
]
requires-python = ">=3.10"
dependencies = [
    "gurobipy",
    "matplotlib",
    "networkx",
    "numpy",
    "open3d",
    "trimesh",
    "pillow",
    "scipy==1.17.1; sys_platform == 'darwin' and python_version >= '3.11'",
    "scipy; sys_platform != 'darwin' or python_version < '3.11'",
    "scikit-image",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=0.21.0",
    "httpx>=0.25.0",
    "aiofiles>=23.2.0",
    "fal-client>=0.4.0",
    "requests>=2.28.0",
    "supabase>=2.9.1",
    "pyjwt[crypto]>=2.8.0",
    "posthog>=3.0.0",
    "onnxruntime>=1.23.2",
    "stripe>=13.2.0",
    "resend>=2.4.0",
    "email-validator>=2.0.0",
    "rembg>=2.0.50",
    "pgserver>=0.1.4",
    "psycopg[binary]>=3.1",
    "rtree>=1.4.1",
    "mcp>=1.30,<2",
    "app-store-server-library>=3.1.2",
    # Reads LEGO connector data for the Fable agents' checks (GPL-3.0-or-later; see the README's License section).
    "pyldraw3==1.7.0; python_full_version >= '3.12'",
]

[project.scripts]
mesh2brick-api = "mesh2brick.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mesh2brick"]

[dependency-groups]
dev = ["pytest>=8.3.5", "pytest-cov>=6.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
