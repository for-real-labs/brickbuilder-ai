name: Nova runtime image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - backend/setup_nova.cjs
      - backend/nova-service/**
      - backend/tests/nova_preview_runtime_smoke.py
      - backend/tests/nova_build_review_smoke.py
      - .github/workflows/nova-runtime.yml
  push:
    branches: [main, staging]
    paths:
      - backend/setup_nova.cjs
      - backend/nova-service/**
      - backend/tests/nova_preview_runtime_smoke.py
      - backend/tests/nova_build_review_smoke.py
      - .github/workflows/nova-runtime.yml

permissions:
  contents: read
  packages: write

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/nova.cjs --prepare
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/nova-service/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: true
          tags: ghcr.io/${{ github.repository }}-nova:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify shared indexes and cache regeneration with isolated owners
        run: >-
          docker run --rm --entrypoint python3
          -v "$PWD/backend/tests/nova_shared_cache_smoke.py:/tmp/cache-smoke.py:ro"
          -e PYTHONPATH=/app/web/backend
          -e NOVA_SERVICE_TOKEN=smoke-local-only
          ghcr.io/${{ github.repository }}-nova:${{ github.sha }}
          /tmp/cache-smoke.py
      - name: Verify preview and full review workflows without provider calls
        run: >-
          docker run --rm --network none
          -v "$PWD/backend/tests/nova_preview_runtime_smoke.py:/tmp/preview-smoke.py:ro"
          -e PYTHONPATH=/app/web/backend
          ghcr.io/${{ github.repository }}-nova:${{ github.sha }}
          python3 /tmp/preview-smoke.py
