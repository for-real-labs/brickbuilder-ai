name: Nova runtime image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - backend/setup_nova.cjs
      - backend/nova-service/**
      - .github/workflows/nova-runtime.yml
  push:
    branches: [main, staging]
    paths:
      - backend/setup_nova.cjs
      - backend/nova-service/**
      - .github/workflows/nova-runtime.yml

permissions:
  contents: read
  packages: write

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/nova.cjs --prepare
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend/.nova/web
          file: backend/.nova/Dockerfile.service
          build-contexts: nova=backend/.nova/toolkit
          build-args: MPD2GLB_SHA256=381fb275c9f974820620ef4e4ec8b5be84ea8306a9f1ccd95bc75beaa8139f34
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}-nova:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
